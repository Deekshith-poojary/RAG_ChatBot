[project]
name = "rag-chatbot"
version = "0.1.0"
description = "PDF RAG chatbot: PyMuPDF + PaddleOCR ingestion, Qdrant (local), Ollama via FastAPI, built-in web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "langchain-text-splitters>=0.3",
    "langdetect>=1.0.9",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "qdrant-client>=1.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rag-api = "rag_chatbot.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatbot"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
